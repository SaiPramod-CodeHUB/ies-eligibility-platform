services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ies
      POSTGRES_USER: ies
      POSTGRES_PASSWORD: ies
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ies -d ies"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/ies
      DB_USER: ies
      DB_PASSWORD: ies
    ports: ["8080:8080"]
